# Builds, tests and packages every push and pull request; the zip is attached
# to the run as an artifact so anyone can try a branch without building it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settings-ui/package-lock.json

      - name: Cache toolchains
        uses: actions/cache@v6
        with:
          path: |
            .toolchain/llvm-mingw-*
            .toolchain/cppwinrt
            .toolchain/webview2
          key: toolchain-${{ hashFiles('scripts/setup.sh') }}

      - name: Set up toolchains
        run: ./scripts/setup.sh

      - name: Build
        env:
          BUNBUN_HOMEPAGE: https://github.com/${{ github.repository }}
        run: ./build.sh

      - name: Test
        run: ./tests/run.sh

      - name: Type-check settings UI
        run: cd settings-ui && npx tsc --noEmit

      - name: Package
        run: ./scripts/package.sh --no-build

      - uses: actions/upload-artifact@v7
        with:
          name: Bunbun-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  linux:
    # 22.04: the oldest supported base, so the packages run on it and anything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settings-ui/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config dpkg-dev \
            libgtk-3-dev libgtk-layer-shell-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libx11-dev xvfb \
            desktop-file-utils  # appimagetool checks the .desktop file with desktop-file-validate

      - name: Build gtk-layer-shell 0.10.0
        # Ubuntu 22.04 ships gtk-layer-shell 0.6.0. The island crashed on right-click
        # with the 0.7.0 the AppImage used to bundle; 0.10.0 (Fedora 42's version) does
        # not. Build it into /usr/local and link against it, so the AppImage carries it.
        run: |
          sudo apt-get install -y -qq meson libwayland-dev wayland-protocols
          git clone --depth 1 --branch v0.10.0 https://github.com/wmww/gtk-layer-shell.git "$RUNNER_TEMP/gtk-layer-shell"
          meson setup "$RUNNER_TEMP/gls-build" "$RUNNER_TEMP/gtk-layer-shell" --prefix=/usr/local --libdir=lib \
            -Ddocs=false -Dtests=false
          sudo meson install -C "$RUNNER_TEMP/gls-build"
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          BUNBUN_HOMEPAGE: https://github.com/${{ github.repository }}
        run: ./scripts/package-linux.sh

      - name: Test
        # The hook against a live island, on a virtual X server.
        run: |
          xvfb-run -a sh -c 'build-linux/bunbun & sleep 3; python3 tests/test_dialects.py; s=$?; build-linux/bunbun --quit; exit $s'

      - uses: actions/upload-artifact@v7
        with:
          name: Bunbun-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
